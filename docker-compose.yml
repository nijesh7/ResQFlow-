version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqflow-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ResQFlow Allocation Engine
      - FIREBASE_PROJECT_ID=resqflow-demo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqflow-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
